<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta OSMC</title>
    <link rel="icon" type="image/png" href="MARCA_HEMOBRÁS_vertical_(1).png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <header class="top-header">
            <div class="branding">
                <img src="MARCA_HEMOBRÁS_vertical_(1).png" alt="Logo Hemobrás" class="logo">
                <div class="titles">
                    <h1>Consulta OSMC</h1>
                    <p>Ordens de Serviço de Manutenção Corretiva</p>
                </div>
            </div>
            <div class="actions">
                <select id="filterStatus" class="filter-select">
                    <option value="">Todos os Status</option>
                </select>
                <div class="multi-select-filter" id="solicitanteFilterDropdown">
                    <button class="multi-select-trigger" type="button" aria-expanded="false" aria-haspopup="listbox" aria-label="Filtrar por solicitantes">
                        <span>Todos os Solicitantes</span><span class="multi-select-caret" aria-hidden="true"></span>
                    </button>
                    <div class="multi-select-menu" hidden>
                        <div class="multi-select-actions">
                            <button type="button" data-action="select-all">Selecionar todos</button>
                            <button type="button" data-action="clear">Limpar</button>
                        </div>
                        <div class="multi-select-options" role="listbox" aria-label="Solicitantes" aria-multiselectable="true"></div>
                    </div>
                    <select id="filterSolicitante" multiple aria-hidden="true" tabindex="-1"></select>
                </div>
                <div class="multi-select-filter" id="blocoFilterDropdown">
                    <button class="multi-select-trigger" type="button" aria-expanded="false" aria-haspopup="listbox" aria-label="Filtrar por blocos">
                        <span>Todos os Blocos</span><span class="multi-select-caret" aria-hidden="true"></span>
                    </button>
                    <div class="multi-select-menu" hidden>
                        <div class="multi-select-actions">
                            <button type="button" data-action="select-all">Selecionar todos</button>
                            <button type="button" data-action="clear">Limpar</button>
                        </div>
                        <div class="multi-select-options" role="listbox" aria-label="Blocos" aria-multiselectable="true"></div>
                    </div>
                    <select id="filterBloco" multiple aria-hidden="true" tabindex="-1"></select>
                </div>
                <select id="filterMotivo" class="filter-select">
                    <option value="">Todos os Motivos</option>
                </select>
                <div class="date-range" aria-label="Filtrar por intervalo de data de emissão">
                    <label class="date-filter" for="filterDateFrom">
                        <span>De</span>
                        <input type="text" id="filterDateFrom" inputmode="numeric" placeholder="dd/mm/aaaa" pattern="\d{2}/\d{2}/\d{4}" maxlength="10" aria-label="Filtrar a partir da data de emissão">
                    </label>
                    <label class="date-filter" for="filterDateUntil">
                        <span>Até</span>
                        <input type="text" id="filterDateUntil" inputmode="numeric" placeholder="dd/mm/aaaa" pattern="\d{2}/\d{2}/\d{4}" maxlength="10" aria-label="Filtrar até a data de emissão">
                    </label>
                </div>

                <button id="btnGenerateReport" class="btn-report" type="button" disabled title="Selecione solicitantes ou blocos para gerar o relatório em PDF">Gerar Relatório em PDF</button>
                <button id="btnRefresh" class="btn-refresh">Atualizar Dados</button>
                <input type="text" id="searchInput" placeholder="Pesquisar OS, Bloco, Equipamento ou Descrição..." autocomplete="off" aria-label="Pesquisar OSMC por número, bloco, equipamento ou descrição">
            </div>
        </header>

        <main class="main-content">
            <div class="loading-state" id="loadingState">
                <p>Sincronizando dados...</p>
            </div>

            <div class="dashboard-summary" id="dashboardSummary" style="display: none;">
                <div class="kpi-cards" id="kpiCardsContainer"></div>
            </div>

            <div class="charts-grid" id="chartsGrid" style="display: none;">
                <div class="chart-box">
                    <h4 id="statusChartTitle">Distribuição por Status</h4>
                    <div class="canvas-container"><canvas id="osmcChart"></canvas></div>
                </div>
                <div class="chart-box">
                    <h4 id="blocoChartTitle">Top 5 Blocos (Volume de OSMC)</h4>
                    <div class="canvas-container"><canvas id="blocoChart"></canvas></div>
                </div>
            </div>

            <div class="table-toggle-container" id="tableToggleContainer" style="display: none;">
                <button id="btnToggleTable" class="btn-toggle-table">Visualizar Lista de O.S. (Detalhamento)</button>
            </div>

            <div id="tableSection" style="display: none;">
                <div class="table-wrapper" id="tableWrapper">
                    <table id="dataTable">
                        <thead id="tableHead"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>

                <div class="pagination-container" id="paginationContainer">
                    <span id="pageInfo" class="page-info">Mostrando 0 resultados</span>
                    <div class="pagination-controls">
                        <button id="btnPrev" class="btn-page" disabled>Anterior</button>
                        <span id="currentPageIndicator" class="current-page">1</span>
                        <button id="btnNext" class="btn-page" disabled>Próximo</button>
                        
                        <div class="page-jump">
                            <input type="number" id="jumpInput" min="1" placeholder="Pág...">
                            <button id="btnJump" class="btn-jump">Ir</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
